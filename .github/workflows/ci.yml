name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Retrieval regression gate. Replays the golden set against recorded
      # vectors (lib/__tests__/fixtures), so it needs no API key and no
      # database, and a red run means the grounding decision changed rather
      # than that a network call was slow. Re-record with npm run eval:record
      # when the embedding model or the seeded KB changes.
      - run: npm run eval
      - run: npm run build
        env:
          # The app's pages are dynamic and all AI/DB clients are lazy, so the
          # build needs no real secrets — placeholders keep next build happy.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
